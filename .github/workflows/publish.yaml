name: Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - created

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm ci
      - run: npx ts-node ./scripts/build.ts
      - uses: decentraland/oddish-action@0074f2d535c43b5c83f136525304a6277166d77f # @3.0.0
        with:
          cwd: "./dist"
          access: public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
